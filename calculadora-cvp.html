<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora CVP — 12.º Dígito · Viatel Viseu</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#060b12;--surface:#0d1825;--border:rgba(255,255,255,.10);--accent:#00c8f0;--text:#eef3fa;--muted:#9aafc4;--input-bg:#111e2e;--detail-bg:#0a1520}
    body.light{--bg:#f0f4f8;--surface:#ffffff;--border:rgba(0,0,0,.12);--text:#0d1825;--muted:#5a6e84;--input-bg:#f5f7fa;--detail-bg:#edf1f5}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .2s,color .2s}
    .header{display:flex;align-items:center;justify-content:space-between;padding:16px 40px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:12px;position:relative}
    .header::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.4}
    .logo{display:flex;align-items:center;gap:10px}
    .logo-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
    .brand{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:4px}
    .brand em{color:var(--accent);font-style:normal}
    .back-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:7px 16px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;transition:all .15s}
    .back-btn:hover{background:rgba(0,200,240,.08);border-color:rgba(0,200,240,.3);color:var(--accent)}
    .theme-btn{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
    .theme-btn:hover{background:rgba(0,200,240,.1);border-color:rgba(0,200,240,.3);color:var(--accent)}
    .hero{text-align:center;padding:32px 24px 16px}
    .hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,5vw,48px);letter-spacing:5px;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    body.light .hero-title{background:linear-gradient(135deg,#0d1825 30%,var(--accent));-webkit-background-clip:text;background-clip:text}
    .hero-sub{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-top:6px}
    .wrap{display:flex;justify-content:center;padding:20px 24px 48px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px;width:100%;max-width:480px}
    label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px;font-weight:700}
    input[type=text]{width:100%;font-size:24px;letter-spacing:6px;font-family:'Courier New',monospace;padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);outline:none;transition:border .15s}
    input[type=text]:focus{border-color:var(--accent)}
    .erro{font-size:13px;color:#ff6b6b;margin-top:8px;min-height:20px}
    .resultado{margin-top:24px;display:none;border-top:1px solid var(--border);padding-top:24px}
    .label-r{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:700}
    .digito-row{display:flex
