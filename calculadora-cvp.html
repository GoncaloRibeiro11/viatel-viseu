<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora CVP — 12.º Dígito · Viatel Viseu</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#060b12;--surface:#0d1825;--border:rgba(255,255,255,.10);--accent:#00c8f0;--text:#eef3fa;--muted:#9aafc4;--input-bg:#111e2e;--detail-bg:#0a1520}
    body.light{--bg:#f0f4f8;--surface:#ffffff;--border:rgba(0,0,0,.12);--text:#0d1825;--muted:#5a6e84;--input-bg:#f5f7fa;--detail-bg:#edf1f5}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .2s,color .2s}
    .header{display:flex;align-items:center;justify-content:space-between;padding:16px 40px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:12px;position:relative}
    .header::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.4}
    .logo{display:flex;align-items:center;gap:10px}
    .logo-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
    .brand{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:4px}
    .brand em{color:var(--accent);font-style:normal}
    .back-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:7px 16px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;transition:all .15s}
    .back-btn:hover{background:rgba(0,200,240,.08);border-color:rgba(0,200,240,.3);color:var(--accent)}
    .header-right{display:flex;align-items:center;gap:10px}
    .theme-btn{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s;font-family:'DM Sans',sans-serif}
    .theme-btn:hover{background:rgba(0,200,240,.1);border-color:rgba(0,200,240,.3);color:var(--accent)}
    .hero{text-align:center;padding:32px 24px 16px}
    .hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,5vw,48px);letter-spacing:5px;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    body.light .hero-title{background:linear-gradient(135deg,#0d1825 30%,var(--accent));-webkit-background-clip:text;background-clip:text}
    .hero-sub{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-top:6px}
    .wrap{display:flex;justify-content:center;padding:20px 24px 48px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px;width:100%;max-width:480px}
    label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px;font-weight:700}
    input[type=text]{width:100%;font-size:24px;letter-spacing:6px;font-family:'Courier New',monospace;padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);outline:none;transition:border .15s}
    input[type=text]:focus{border-color:var(--accent)}
    .erro{font-size:13px;color:#ff6b6b;margin-top:8px;min-height:20px}
    .resultado{margin-top:24px;display:none;border-top:1px solid var(--border);padding-top:24px}
    .label-r{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:700}
    .digito-row{display:flex;align-items:center;gap:16px}
    .digito-val{font-family:'Bebas Neue',sans-serif;font-size:72px;line-height:1;color:var(--accent);text-shadow:0 0 30px rgba(0,200,240,.4)}
    .digito-codigo{font-family:'Courier New',monospace;font-size:18px;letter-spacing:4px;color:var(--muted);margin-top:6px}
    .digito-codigo span{color:var(--accent);font-weight:700}
    .detail-box{margin-top:20px;background:var(--detail-bg);border:1px solid var(--border);border-radius:12px;padding:16px}
    .detail-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
    .detail-row:last-child{border-bottom:none}
    .detail-row span:last-child{font-family:'Courier New',monospace;color:var(--text)}
    @media(max-width:600px){
      .header{padding:14px 18px}
      .brand{font-size:20px;letter-spacing:2px}
      .wrap{padding:16px 14px 40px}
      .card{padding:22px 18px}
      input[type=text]{font-size:20px;letter-spacing:4px}
      .digito-val{font-size:56px}
    }
  
/* -- TEMA CLARO -- */
body.light{--bg:#f0f4f8;--surface:#ffffff;--border:rgba(0,0,0,.10);--text:#0d1825;--muted:#5a6e84;background-image:none!important}
body.light .kpi,body.light .card,body.light .right>.card{background:#fff}
body.light .kpi-strip{background:rgba(0,0,0,.06)}
body.light .lbr:hover{background:rgba(0,0,0,.02)}
body.light .lbr,body.light .wr{border-color:rgba(0,0,0,.05)}
body.light .lb thead tr{border-color:rgba(0,0,0,.08)}
body.light .sh::after{background:rgba(0,0,0,.08)}
body.light .pw,.body.light .wb{background:rgba(0,0,0,.06)}
body.light .atual-row{background:rgba(0,200,240,.04)}
body.light .month-nav-bar{background:rgba(255,255,255,.9)}
body.light .nav-back{border-color:rgba(0,0,0,.15);color:#5a6e84}
body.light .nav-mbtn.nav-closed{color:rgba(90,110,132,.45)}
body.light .tba{background:rgba(0,200,240,.04);border-color:rgba(0,200,240,.15)}
body.light .tbr{background:rgba(255,95,46,.04);border-color:rgba(255,95,46,.15)}
body.light .card{border-color:rgba(0,0,0,.08)}
body.light .ct{border-color:rgba(0,0,0,.08)}
body.light .wr:last-child{border:none}
.theme-btn{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:20px;padding:5px 13px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .2s;font-family:'DM Sans',sans-serif;flex-shrink:0}
.theme-btn:hover{background:rgba(0,200,240,.1);border-color:rgba(0,200,240,.3);color:var(--accent)}
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <div class="logo-dot"></div>
    <div class="brand">VIA<em>TEL</em> VISEU</div>
  </div>
  <div class="header-right">
    <a href="index.html" class="back-btn">&#8592; Dashboard</a>
    <button class="theme-btn vv-theme-btn" id="theme-btn" onclick="toggleTheme()">&#127769;&#65039; Escuro</button>
  </div>
</header>

<div class="hero">
  <div class="hero-title">Calculadora CVP</div>
  <div class="hero-sub">12.&#186; D&#237;gito &middot; Valida&#231;&#227;o de Contrato</div>
</div>

<div class="wrap">
  <div class="card">
    <label for="cvp-input">C&#243;digo CVP (11 d&#237;gitos)</label>
    <input type="text" id="cvp-input" maxlength="11" placeholder="00000000000"
           autocomplete="off" inputmode="numeric"
           oninput="calcular(this.value)">
    <div class="erro" id="erro"></div>

    <div class="resultado" id="resultado">
      <div class="label-r">12.&#186; D&#237;gito</div>
      <div class="digito-row">
        <div class="digito-val" id="digito-val">&#8212;</div>
        <div>
          <div class="label-r" style="margin-bottom:4px">C&#243;digo completo</div>
          <div class="digito-codigo" id="digito-codigo"></div>
        </div>
      </div>
      <div class="detail-box" id="detail-box"></div>
    </div>
  </div>
</div>

<script>
  var PESOS = [2,1,2,1,2,1,2,1,2,1,2];

  function calcular(v) {
    var err = document.getElementById('erro');
    var res = document.getElementById('resultado');
    var digEl = document.getElementById('digito-val');
    var codEl = document.getElementById('digito-codigo');
    var det = document.getElementById('detail-box');

    v = v.replace(/\D/g,'');
    document.getElementById('cvp-input').value = v;

    if (v.length === 0) {
      err.textContent = '';
      res.style.display = 'none';
      return;
    }
    if (v.length < 11) {
      err.textContent = 'Introduza os 11 dígitos do CVP';
      res.style.display = 'none';
      return;
    }

    err.textContent = '';
    res.style.display = 'block';

    var soma = 0;
    var rows = '';
    for (var i = 0; i < 11; i++) {
      var d = parseInt(v[i], 10);
      var p = PESOS[i];
      var prod = d * p;
      soma += prod;
      rows += '<div class="detail-row"><span>Pos ' + (i+1) + ' &times; ' + p + '</span><span>' + d + ' &times; ' + p + ' = ' + prod + '</span></div>';
    }
    var digito = (10 - (soma % 10)) % 10;

    rows += '<div class="detail-row"><span>Soma total</span><span>' + soma + '</span></div>';
    rows += '<div class="detail-row"><span>Módulo 10</span><span>' + (soma % 10) + '</span></div>';
    rows += '<div class="detail-row"><span>12.º Dígito</span><span>' + digito + '</span></div>';

    digEl.textContent = digito;
    var cod = v + digito;
    codEl.innerHTML = cod.slice(0,11) + '<span>' + digito + '</span>';
    det.innerHTML = rows;
  }

  function toggleTheme() {
    var l = document.body.classList.toggle('light');
    localStorage.setItem('vv_theme', l ? 'light' : 'dark');
    var btn = document.getElementById('theme-btn');
    if (btn) btn.innerHTML = l ? '&#9728;&#65039; Claro' : '&#127769;&#65039; Escuro';
  }

  (function() {
    if (localStorage.getItem('vv_theme') === 'light') {
      document.body.classList.add('light');
      document.addEventListener('DOMContentLoaded', function() {
        var btn = document.getElementById('theme-btn');
        if (btn) btn.innerHTML = '&#9728;&#65039; Claro';
      });
    }
  })();
</script>
</body>
</html>
